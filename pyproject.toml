[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ==============================================================================
# Project metadata
# ==============================================================================

[project]
name            = "ai-software-pipeline"
version         = "0.1.0"
description     = "Automated AI pipeline: Telegram → GitHub Copilot → PR → CI → Telegram"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "MIT" }

authors = [
    { name = "AI Pipeline Team" },
]

keywords = [
    "github-copilot",
    "telegram-bot",
    "ai-pipeline",
    "fastapi",
    "aiogram",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

# Runtime dependencies are managed in requirements.txt for pip compatibility.
# This section stays minimal to avoid duplication.
dependencies = []

# ==============================================================================
# Package discovery
# ==============================================================================

[tool.setuptools.packages.find]
where   = ["."]
include = ["app*", "adapters*", "config*", "orchestrator*", "telegram_bot*", "webhooks*", "github*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

# ==============================================================================
# pytest
# ==============================================================================

[tool.pytest.ini_options]
asyncio_mode  = "strict"
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli       = true
log_cli_level = "WARNING"
addopts       = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast, isolated unit tests (no I/O)",
    "integration: tests that talk to real external services",
    "slow: tests that take more than 2 seconds",
]

# ==============================================================================
# ruff (linting + formatting)
# ==============================================================================

[tool.ruff]
target-version = "py312"
line-length    = 100
src            = [".", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012", # mutable class attributes (Pydantic models)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "adapters", "config", "orchestrator", "telegram_bot", "webhooks", "github"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# mypy (static type checking)
# ==============================================================================

[tool.mypy]
python_version            = "3.12"
strict                    = false
ignore_missing_imports    = true
disallow_untyped_defs     = true
disallow_incomplete_defs  = true
check_untyped_defs        = true
warn_redundant_casts      = true
warn_unused_ignores       = true
warn_return_any           = false
no_implicit_optional      = true
show_error_codes          = true

[[tool.mypy.overrides]]
module              = ["tests.*"]
disallow_untyped_defs = false

# ==============================================================================
# coverage
# ==============================================================================

[tool.coverage.run]
source   = ["app", "adapters", "config", "orchestrator", "telegram_bot", "webhooks"]
omit     = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]
branch   = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 60
exclude_lines  = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
